services:
  app:
    build: .
    container_name: tournament-manager
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - tournament-data:/var/www/html/database
      - tournament-storage:/var/www/html/storage

volumes:
  tournament-data:
  tournament-storage:

